[project]
name = "polimillionaire"
version = "0.1.0"
description = "Chatbot for the PoliMillionaire NLP group assignment, PoliMi 2025/26."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "polars>=1.0",
    "pydantic>=2.6",
    "sympy>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]
# Optional. Heavy and platform-specific (Metal on Mac, CUDA wheel on Colab,
# CPU-only on most laptops). Install with `uv sync --group llm`.
llm = [
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.24",
]
# Optional. Pulls torch + transformers via sentence-transformers (~600 MB)
# plus faiss for ANN search and `datasets` for the HF corpus loaders.
# Install with `uv sync --group rag`.
rag = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "datasets>=2.20",
    "numpy>=1.26",
    "bm25s>=0.3.8",
]
# Optional. For the Kaggle-Dataset round-trip of the question log.
# Pre-installed on Kaggle kernels; only need this group locally to run
# the one-time `scripts/kaggle_db_init.py` seeding step.
# Install with `uv sync --group kaggle`.
kaggle = [
    "kaggle>=1.6",
    "numpy>=1.26"
]
# Optional. Plotting + tabular deps for running notebooks/final.ipynb
# locally (gallery render, live leaderboard, Philosophy/News panel).
# Install with `uv sync --group notebook`.
notebook = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polimillionaire"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/polimillionaire/_vendor"]  # vendored, do not lint or format

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is enforced by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
