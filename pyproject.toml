[project]
name = "polimillionaire"
version = "0.1.0"
description = "Chatbot for the PoliMillionaire NLP group assignment, PoliMi 2025/26."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "polars>=1.0",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polimillionaire"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/polimillionaire/_vendor"]  # vendored, do not lint or format

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is enforced by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
